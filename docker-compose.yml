# GameShelf — local development database.
#
# Convenience only: the application has no dependency on Docker or on this
# file. It only needs a MySQL 8.4 server reachable through DATABASE_URL,
# with character set utf8mb4 (see docs/features/references/operations.md, "Database (local dev)").
#
# Credentials come from the environment (the .env file next to this file).
# Never commit real values — .env is gitignored.

services:
  mysql:
    # Pinned major.minor per ADR-001 — never "latest".
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required — copy .env.example to .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gameshelf}
      MYSQL_USER: ${MYSQL_USER:-gameshelf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required — copy .env.example to .env}
    command:
      # Server-level charset per ADR-001; databases created by the entrypoint inherit these.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # Localhost-only by default; change the host part to expose it.
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      # Docker-managed named volume — never an ephemeral container path and
      # never a repo bind mount. Recreating the container keeps the data;
      # `docker compose down -v` removes it (see docs/features/references/operations.md,
      # "Persistent data directory").
      - mysql-data:/var/lib/mysql
      # One-time bootstrap: creates the Prisma shadow database for
      # `prisma migrate dev` (runs only on first initialization of an
      # empty data dir — see docs/features/references/operations.md, "Migrations (Prisma)").
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
    # Fixed name, so the reset/snapshot commands in docs/features/references/operations.md are the same
    # for every checkout. Lives wherever Docker stores volumes on this host.
    name: gameshelf-mysql-data
