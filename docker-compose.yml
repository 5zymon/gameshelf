# GameShelf — local development database and job queue.
#
# Convenience only: the application has no dependency on Docker or on this
# file. It only needs a MySQL 8.4 server reachable at MYSQL_HOST:MYSQL_PORT
# with character set utf8mb4, and a Redis 7.4 server reachable at
# REDIS_HOST:REDIS_PORT (see README, "Database (local dev)" and
# "Redis (local dev)").
#
# Credentials come from the environment (the .env file next to this file).
# Never commit real values — .env is gitignored.

services:
  mysql:
    # Pinned major.minor per ADR-001 — never "latest".
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required — copy .env.example to .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gameshelf}
      MYSQL_USER: ${MYSQL_USER:-gameshelf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required — copy .env.example to .env}
    command:
      # Server-level charset per ADR-001; databases created by the entrypoint inherit these.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # Localhost-only by default; change the host part to expose it.
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      # Persistent host path (gitignored) — never an ephemeral container path.
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  redis:
    # Pinned major.minor — never "latest".
    image: redis:7.4
    command:
      # AOF persistence — queued job state survives a Redis restart.
      - --appendonly
      - 'yes'
    ports:
      # Localhost-only by default; change the host part to expose it.
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      # Persistent host path (gitignored) — never an ephemeral container path.
      - ./data/redis:/data
    healthcheck:
      test:
        - 'CMD'
        - 'redis-cli'
        - 'ping'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
