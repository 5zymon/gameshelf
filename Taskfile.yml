version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies for both workspaces and set up git hooks
    cmds:
      - npm install

  dev:
    desc: Start the API and the web app in watch mode
    cmds:
      - npm run dev

  lint:
    desc: Lint both workspaces with ESLint
    cmds:
      - npm run lint

  lint:fix:
    desc: Lint both workspaces and apply ESLint autofixes
    cmds:
      - npm run lint:fix

  typecheck:
    desc: Type-check both workspaces
    cmds:
      - npm run typecheck

  test:
    desc: Run the API test suite (unit + e2e; e2e needs a running MySQL with the gameshelf_test database and a running Redis)
    cmds:
      - npm run test

  format:
    desc: Format the whole repo with Prettier
    cmds:
      - npm run format

  format:check:
    desc: Check formatting without writing changes
    cmds:
      - npm run format:check

  build:
    desc: Build both workspaces
    cmds:
      - npm run build

  db:generate:
    desc: Generate the Prisma client
    cmds:
      - npm run db:generate

  db:migrate:check:
    desc: Fail if schema.prisma and the deployed database have diverged (needs a running MySQL)
    cmds:
      - npm run db:migrate:check

  covers:redownload:
    desc: Re-download every missing game cover from its stored game-database link (needs a running MySQL)
    cmds:
      - npm run covers:redownload

  fix:
    desc: Apply ESLint autofixes and Prettier formatting
    cmds:
      - task: lint:fix
      - task: format

  check:
    desc: Run all quality gates (format check, lint, typecheck)
    cmds:
      - task: format:check
      - task: lint
      - task: typecheck

  ci:
    desc: Full CI gate (generate + check + build + tests + migration check)
    cmds:
      - task: db:generate
      - task: check
      - task: build
      - task: test
      - task: db:migrate:check

  clean:
    desc: Remove node_modules and build output
    cmds:
      - npm run clean
